name: "doppelganger"
services:
  web:
    image: "ghcr.io/nefum/doppelganger:web-latest"
    restart: unless-stopped
    hostname: "doppelganger"
    build:
      context: apps/web
      dockerfile: Dockerfile
      secrets:
        - sentry_token
      args:
        - SENTRY_RELEASE=master
    ports:
      # port 81 for a reverse proxy in front
      - "81:3000/tcp"
    volumes:
      # ANDROID_RUNTIME_DIR
      - "/opt/doppelganger:/opt/doppelganger"
      # DOCKER_HOST
      - "/var/run/docker.sock:/var/run/docker.sock"
    env_file:
      - ".env.local"
    networks:
      # EXTERNAL_NETWORK_NAME
      - "doppelganger"
  cron:
    image: "ghcr.io/regulad/http-docker-cron:latest"
    restart: unless-stopped
    environment:
      CRON_SCHEDULE: "* * * * *"
      ENDPOINT: "http://doppelganger:3000/api/cron"
    networks:
      # EXTERNAL_NETWORK_NAME
      - "doppelganger"
  redis:
    image: "redis:8"
    restart: unless-stopped
    hostname: "redis"
    networks:
      - "doppelganger"
secrets:
  sentry_token:
    environment: "SENTRY_AUTH_TOKEN"
networks:
  doppelganger:
    external: true
