# Dependabot keeps every pinned version current: the pnpm workspace's packages, the Pheidippides apps' Gradle
# dependencies, the web image's base image, and GitHub Actions. Production's compose file lives in regulad/homelab,
# which keeps its images current.
#
# Each ecosystem gets one PR a week grouping its minor and patch updates. workflows/dependabot-auto-merge.yml has GitHub
# merge every minor and patch update once CI passes, security updates included, and a merge to master deploys. These
# wait for a person:
# - the nextjs group: next.config.mjs's pinMdxToServerComponents works around a Next.js bug in the versions it was
#   written against, so each Next.js update needs that checked. The workflow holds any PR that touches a dependency a
#   group's exclude-patterns names, here the npm group's, so a security update that bumps next waits as well;
# - the actions group, and any other GitHub Actions update, since workflow changes get a review;
# - major updates, which come as PRs of their own, a Gradle one covering all three apps.
#
# Security updates are off for this repository (.github/settings.yml says why), so security fixes arrive through the
# version updates below, after the cooldown. Were they turned on, the workflow would merge them under the same rules.
#
# The nextjs group names its dependencies exactly, and the npm group excludes them by the same names. Dependabot ranks a group without patterns above any wildcard pattern, and a job refreshing one group
# takes every dependency that group contains, whatever other group it also belongs to.
#
# The cooldown holds each release back until it is two weeks old, so nothing ships while it's days old.
version: 2

updates:
  # The pnpm workspace: the root's tools and apps/web, in the one lockfile, pnpm-lock.yaml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    ignore:
      # tailwind-merge 3 supports Tailwind CSS 4 only, and the site is on Tailwind 3: the two move together, by hand.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # Tailwind CSS 4 needs the config rewritten (#91), along with tailwind-merge 3.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet ("typescript-eslint does not support TS 7.0"); 6.x still comes
      # through. Lift this once typescript-eslint supports 7.
      - dependency-name: "typescript"
        versions: [">= 7"]
      # @types/node describes the Node the site runs on, 24 (apps/web's engines and the image's node:24); a newer major
      # would type APIs it lacks. Raise this with the runtime.
      - dependency-name: "@types/node"
        versions: [">= 25"]
    groups:
      nextjs:
        patterns:
          - "next"
          - "@next/mdx"
          - "eslint-config-next"
        update-types: ["minor", "patch"]
      npm:
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "next"
          - "@next/mdx"
          - "eslint-config-next"

  # The three Pheidippides apps, each group in one PR across them.
  - package-ecosystem: "gradle"
    directories:
      - "/pheidippides/PheidippidesNotify"
      - "/pheidippides/PheidippidesLocate"
      - "/pheidippides/PheidippidesAdministrate"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      gradle:
        update-types: ["minor", "patch"]
      # A PR for each dependency's major update, rather than one for each app
      gradle-major:
        group-by: dependency-name
        update-types: ["major"]

  # apps/web/Dockerfile's base image. Its apk pins follow the Alpine release in its tag.
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    ignore:
      # The image's Node is apps/web's (engines: ^24.11.0). Native addons such as cpu-features don't build on newer majors.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: ["minor", "patch"]
