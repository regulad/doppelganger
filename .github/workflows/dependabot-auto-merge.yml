name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's npm, gradle and docker groups, which hold only minor and patch updates
# (see dependabot.yml). GitHub then merges each one once CI's required checks pass (.github/settings.yml), and the
# merge's push to master runs ci-cd.yml like any other: it builds, publishes, deploys, and records the Sentry release.
#
# The groups are named here rather than matching any group: GitHub's grouped security updates come as a group too
# (npm_and_yarn), and they skip the cooldown. Those, the nextjs, kotlin and actions groups, and major updates all wait
# for a person.
#
# Auto-merge is turned on with the DEPENDABOT_MERGE_TOKEN secret, not GITHUB_TOKEN. GitHub credits the merge to whoever
# turned auto-merge on, and starts no workflows for a push credited to GITHUB_TOKEN, so ci-cd.yml would never run. The
# token is a fine-grained personal access token for this repository only, with read and write access to Contents and
# Pull requests. It has no access to workflows, so it couldn't merge the GitHub Actions updates even by mistake. It's a
# Dependabot secret because runs started by Dependabot can only read Dependabot secrets.
on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once CI passes
        if: >-
          contains(fromJSON('["npm", "gradle", "docker"]'), steps.metadata.outputs.dependency-group)
          && steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
