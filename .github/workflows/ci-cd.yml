name: CI/CD

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  #  schedule:
  #    - cron: "43 23 * * *"
  push:
    branches: ["master"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# A newer run on the same branch or PR cancels the one in progress, rather
# than both building and publishing.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # java, gradle & android
  JAVA_VERSION: "17"
  DISTRIBUTION: "oracle"
  MAIN_PROJECT_MODULE: app
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  check:
    runs-on: "ubuntu-latest"
    name: Check
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: false
          fetch-depth: 0
          submodules: "recursive"

      - name: Load public environment variables
        run: |
          if [ -f apps/web/.env.local.public ]; then
            set -a && source apps/web/.env.local.public && set +a
          else
            echo "Error: apps/web/.env.local.public not found"
            exit 1
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        # no need to pin version for gradle, it tries to get it from the wrapper by default

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758

      # turbo's local cache, kept between runs; the remote cache is used too
      # when TURBO_TOKEN is set
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: |
            turbo-check-

      # Run CI tasks
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22" # as in apps/web engines and its Dockerfile
          cache: "pnpm"

      - name: Install dependencies with pnpm
        run: pnpm install

      - name: Turbo
        run: |
          if pnpm run format --check | grep -q "Files were formatted"; then
            echo "Formatting changes detected. Please run 'pnpx turbo run format' locally and commit the changes."
            exit 1
          fi
          ./scripts/verify-clean-commit.sh
          pnpx turbo run lint type-check test

  build-android:
    runs-on: "ubuntu-latest"
    name: Build ${{ matrix.tag }}
    needs:
      - check

    strategy:
      fail-fast: true
      matrix:
        include:
          - tag: "pheidippides-notify" # package.json name
            context: "pheidippides/PheidippidesNotify"
          - tag: "pheidippides-locate"
            context: "pheidippides/PheidippidesLocate"
          - tag: "pheidippides-administrate"
            context: "pheidippides/PheidippidesAdministrate"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: false
          fetch-depth: 0
          submodules: "recursive"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22" # as in apps/web engines and its Dockerfile
          cache: "pnpm"

      # turbo's local cache, kept between runs; the remote cache is used too
      # when TURBO_TOKEN is set
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.tag }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.tag }}-

      - name: Build via turbo
        run: pnpx turbo build --filter=${{ matrix.tag }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: ${{ matrix.context }}/app/build/outputs/apk/debug/app-debug.apk

  build-docker:
    # Each platform builds on a native runner, arm64 included, rather than
    # under QEMU emulation. Each pushes its image by digest alone; merge-docker
    # then joins them into one multi-platform image and tags it.
    runs-on: ${{ matrix.runner }}
    name: Build web (${{ matrix.platform }})
    needs:
      - build-android

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: "linux/amd64"
            runner: "ubuntu-24.04"
          - platform: "linux/arm64"
            runner: "ubuntu-24.04-arm"

    steps:
      # linux/arm64 -> linux-arm64, for artifact and cache names
      - name: Name the platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true
          fetch-depth: 0
          submodules: "recursive"

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only: merge-docker sets the tags
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # The Pheidippides APKs from build-android
      - uses: actions/download-artifact@v4
        name: Download APKs
        with:
          pattern: pheidippides-*
          path: apps/web/android

      # The Next.js build cache lives in a BuildKit cache mount (next-cache in
      # the Dockerfile). Layer caches don't keep cache mounts, so it is
      # carried between runs through the Actions cache instead.
      - name: Cache the Next.js build cache
        id: next-cache
        uses: actions/cache@v4
        with:
          path: next-cache
          key: next-cache-${{ env.PLATFORM_PAIR }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ env.PLATFORM_PAIR }}-

      - name: Load the Next.js build cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "next-cache": {
                "target": "/usr/src/app/.next/cache",
                "id": "next-cache"
              }
            }
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit }}

      # Build, and push by digest except on PR
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: apps/web
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Layers are cached in GHCR, one cache image per platform: the image
          # is several GB, too big for the 10 GB Actions cache. PRs read it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-web-${{ env.PLATFORM_PAIR }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-web-{2},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAME, env.PLATFORM_PAIR) || '' }}
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    runs-on: "ubuntu-latest"
    name: Publish web
    if: github.event_name != 'pull_request'
    needs:
      - build-docker

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-web-*
          merge-multiple: true

      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: "v2.2.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            prefix=web-,onlatest=true
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      # One manifest list over the per-platform images, under every tag
      - name: Create the multi-platform image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Sign the resulting Docker image digest.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

