name: CI/CD

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  #  schedule:
  #    - cron: "43 23 * * *"
  push:
    branches: ["master"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# Serialize the pipeline per ref, across push, tag, PR and manual runs: one run
# at a time, and every run finishes. Each run on master publishes web-latest,
# restarts production and records a Sentry deploy, so none may be cancelled or
# skipped. Pushes that arrive while a run is going wait in line (queue: max, up
# to 100) and run in order. A push carrying several commits is still one run,
# for the newest of them.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # turbo
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # java, gradle & android
  JAVA_VERSION: "17"
  # Temurin's latest 17 update: Oracle's free download of 17 is only the 2021
  # GA build, missing five years of fixes
  DISTRIBUTION: "temurin"
  MAIN_PROJECT_MODULE: app
  # Full stack traces, so a Gradle failure in CI shows its cause
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.logging.stacktrace=all"

jobs:
  check:
    runs-on: "ubuntu-latest"
    name: Check
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
          submodules: "recursive"

      - name: Load public environment variables
        run: |
          if [ -f apps/web/.env.local.public ]; then
            set -a && source apps/web/.env.local.public && set +a
          else
            echo "Error: apps/web/.env.local.public not found"
            exit 1
          fi

      # turbo's local cache, kept between runs; the remote cache is used too
      # when TURBO_TOKEN is set
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-check-${{ github.sha }}
          restore-keys: |
            turbo-check-

      # Run CI tasks
      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22" # as in apps/web engines and its Dockerfile
          cache: "pnpm"

      - name: Install dependencies with pnpm
        run: pnpm install

      # prettier --check lists the unformatted files and exits non-zero
      - name: Check formatting
        run: |
          pnpm run format --check || {
            echo "::error::Some files aren't formatted. Run 'pnpm run format --write' and commit the result."
            exit 1
          }

      # The Pheidippides apps are linted and tested in build-android, each on
      # its own runner, rather than here, where their Gradle builds would run
      # side by side and contend for the one Gradle daemon registry
      - name: Turbo
        run: |
          ./scripts/verify-clean-commit.sh
          pnpm exec turbo run lint type-check test --filter='!pheidippides-*'

  # Lints, tests and builds each Pheidippides app on its own runner, in
  # parallel with check. Its APK goes to build-docker as an artifact.
  build-android:
    runs-on: "ubuntu-latest"
    name: Build ${{ matrix.tag }}

    env:
      # A step's if can't read secrets directly
      HAS_SIGNING_KEY: ${{ secrets.SOPS_AGE_KEY != '' }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - tag: "pheidippides-notify" # package.json name
            context: "pheidippides/PheidippidesNotify"
          - tag: "pheidippides-locate"
            context: "pheidippides/PheidippidesLocate"
          - tag: "pheidippides-administrate"
            context: "pheidippides/PheidippidesAdministrate"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 0
          submodules: "recursive"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758
          # the default, "tools platform-tools", fails: Google's SDK
          # repository no longer has the legacy tools package
          packages: "platform-tools"

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22" # as in apps/web engines and its Dockerfile
          cache: "pnpm"

      # Pheidippides' signing key is kept in pheidippides/signing.sops.yaml,
      # encrypted to this repository's own age key (the SOPS_AGE_KEY secret) and
      # Parker's. Signing every build with it lets each version install over the
      # one before it. A run without the secret, such as a PR from a fork, builds
      # with the default debug key instead.
      - name: Install SOPS
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/sops"

      - name: Decrypt the signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          secrets=pheidippides/signing.sops.yaml
          password="$("$RUNNER_TEMP/sops" decrypt --extract '["password"]' "$secrets")"
          echo "::add-mask::$password"
          "$RUNNER_TEMP/sops" decrypt --extract '["keystore"]' "$secrets" | base64 -d > "$RUNNER_TEMP/pheidippides.p12"
          {
            echo "PHEIDIPPIDES_KEYSTORE=$RUNNER_TEMP/pheidippides.p12"
            echo "PHEIDIPPIDES_KEY_ALIAS=$("$RUNNER_TEMP/sops" decrypt --extract '["alias"]' "$secrets")"
            echo "PHEIDIPPIDES_KEYSTORE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # turbo's local cache, kept between runs; the remote cache is used too
      # when TURBO_TOKEN is set
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.tag }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.tag }}-

      # this job doesn't install the workspace, so it fetches the turbo version
      # the root package.json pins. Lint and test run first, in a step of their
      # own: each starts with gradle clean, which would delete the APK if it
      # ran after the build.
      - name: Lint and test via turbo
        run: pnpm dlx "turbo@$(node -p 'require("./package.json").devDependencies.turbo')" run lint test --filter=${{ matrix.tag }}

      - name: Build via turbo
        run: pnpm dlx "turbo@$(node -p 'require("./package.json").devDependencies.turbo')" build --filter=${{ matrix.tag }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tag }}
          path: ${{ matrix.context }}/app/build/outputs/apk/debug/app-debug.apk

      # Sentry's Android SDK names its release <package>@<versionName>+<versionCode>.
      # sentry-release-pheidippides records it.
      - name: Name the Sentry release
        run: |
          jq -r '"\(.applicationId)@\(.elements[0].versionName)+\(.elements[0].versionCode)"' \
            "$CONTEXT/app/build/outputs/apk/debug/output-metadata.json" > "$RUNNER_TEMP/sentry-release"
          cat "$RUNNER_TEMP/sentry-release"
        env:
          CONTEXT: ${{ matrix.context }}

      - name: Upload the Sentry release name
        uses: actions/upload-artifact@v7
        with:
          name: sentry-release-${{ matrix.tag }}
          path: ${{ runner.temp }}/sentry-release

  # Runs each Pheidippides app's device tests (app/src/androidTest) on an
  # emulator at the oldest and newest Android versions the devices run, against
  # its deviceTest build: the debug APK with Sentry's DSN pointed nowhere.
  # build-android only compiles, lints and unit-tests the apps; this shows that
  # an update still works on Android itself.
  test-android:
    runs-on: "ubuntu-latest"
    name: Test Pheidippides on API ${{ matrix.api-level }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: false
          # versionCode counts each app's commits, which needs the whole history
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The emulator needs KVM, which GitHub's Linux runners have but don't
      # open to the runner's user
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Each script line runs on its own, from the repository root. adb root
      # lets the tests set persist.doppelganger.* as Doppelganger's initial
      # setup does; right after boot adbd can still refuse it ("unable to
      # connect for root: closed"), so it's retried. No SENTRY_AUTH_TOKEN
      # here: nothing is uploaded.
      - name: Run the device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            rooted=; for i in 1 2 3 4 5 6; do adb root && rooted=1 && break; sleep 5; done; [ -n "$rooted" ]
            adb wait-for-device
            cd pheidippides/PheidippidesNotify && ./gradlew --no-daemon --console=plain connectedAndroidTest
            cd pheidippides/PheidippidesLocate && ./gradlew --no-daemon --console=plain connectedAndroidTest
            cd pheidippides/PheidippidesAdministrate && ./gradlew --no-daemon --console=plain connectedAndroidTest

      - name: Upload the device test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pheidippides-device-tests-api-${{ matrix.api-level }}
          path: pheidippides/*/app/build/reports/androidTests/connected/

  build-docker:
    # Each platform builds on a native runner, arm64 included, rather than
    # under QEMU emulation. Each pushes its image by digest alone; merge-docker
    # then joins them into one multi-platform image and tags it.
    runs-on: ${{ matrix.runner }}
    name: Build web (${{ matrix.platform }})
    needs:
      - check
      - build-android

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
        include:
          - platform: "linux/amd64"
            runner: "ubuntu-24.04"
          - platform: "linux/arm64"
            runner: "ubuntu-24.04-arm"

    steps:
      # linux/arm64 -> linux-arm64, for artifact and cache names
      - name: Name the platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
          submodules: "recursive"

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only: merge-docker sets the tags
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # The Pheidippides APKs from build-android
      - uses: actions/download-artifact@v8
        name: Download APKs
        with:
          pattern: pheidippides-*
          path: apps/web/android

      # The Next.js build cache lives in a BuildKit cache mount (next-cache in
      # the Dockerfile). Layer caches don't keep cache mounts, so it is
      # carried between runs through the Actions cache instead.
      - name: Cache the Next.js build cache
        id: next-cache
        uses: actions/cache@v6
        with:
          path: next-cache
          key: next-cache-${{ env.PLATFORM_PAIR }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ env.PLATFORM_PAIR }}-

      - name: Load the Next.js build cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "next-cache": {
                "target": "/usr/src/app/apps/web/.next/cache",
                "id": "next-cache"
              }
            }
          skip-extraction: ${{ steps.next-cache.outputs.cache-hit }}

      # Build, and push by digest except on PR
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The repository's root, for the workspace's lockfile; the root
          # .dockerignore keeps the context to what the image uses
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Layers are cached in GHCR, one cache image per platform: the image
          # is several GB, too big for the 10 GB Actions cache. PRs read it.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-web-${{ env.PLATFORM_PAIR }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-web-{2},mode=max,image-manifest=true,oci-mediatypes=true', env.REGISTRY, env.IMAGE_NAME, env.PLATFORM_PAIR) || '' }}
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    runs-on: "ubuntu-latest"
    name: Publish web
    if: github.event_name != 'pull_request'
    needs:
      - build-docker
      # A master push whose device tests fail isn't published or deployed
      - test-android

    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-web-*
          merge-multiple: true

      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: "v2.2.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false: rather than metadata-action's automatic latest, which
          # adds web-latest on version tags, the raw latest tags below write
          # web-latest and plain latest together, on master and version tags.
          # prefix= (empty) overrides the flavor's web- for plain latest.
          flavor: |
            prefix=web-,onlatest=true
            latest=false
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,prefix=,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      # One manifest list over the per-platform images, under every tag
      - name: Create the multi-platform image
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Sign the resulting Docker image digest.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Tells doppelgangerhq.com to update now, rather than at its daily
  # doppelganger-update.timer run. The host runs webhookd on loopback behind
  # Tailscale Serve, and the tailnet policy lets only tag:ci-client-doppelganger
  # reach it. So the job joins the tailnet as that tag, through a Tailscale
  # federated identity that trusts this repository's master branch: its OIDC
  # subject is repo:regulad@52430642/doppelganger@823433320:ref:refs/heads/master,
  # the immutable form, which names the owner and repository by ID as well as by
  # name. Version tags also move web-latest, but the identity doesn't trust them,
  # so those wait for the daily timer.
  #
  # The hook starts doppelganger-update.service and answers at once: 200 means
  # the update started. The service pulls and restarts the compose stack, and
  # the web image is several GB, so production runs the new image a few minutes
  # later. A failure doesn't fail the run, since the daily timer still picks the
  # image up within a day.
  deploy:
    runs-on: "ubuntu-latest"
    name: Deploy web
    if: github.ref == 'refs/heads/master'
    needs:
      - merge-docker
    continue-on-error: true

    permissions:
      # Mints the GitHub OIDC token the federated identity accepts, so no
      # long-lived Tailscale secret is stored
      id-token: write

    outputs:
      # "true" once the hook has started the update; sentry-release records a
      # deploy only then
      started: ${{ steps.start.outputs.started }}

    # Each step has a time limit, so a hang becomes an ordinary failure that
    # continue-on-error absorbs, rather than running to GitHub's 6-hour default
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        timeout-minutes: 3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-client-doppelganger
          hostname: doppelganger-deploy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start the update
        id: start
        timeout-minutes: 2
        run: |
          # The hook answers at once, so 30 seconds per attempt is plenty
          if curl -fsS --connect-timeout 10 --max-time 30 --retry 3 --retry-connrefused \
            -X POST "https://doppelgangerhq-com.tail11540.ts.net:8108/auto-update"; then
            echo "Started the update on doppelgangerhq.com."
            echo "started=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Couldn't start the update on doppelgangerhq.com; its daily doppelganger-update.timer run will pick web-latest up."
            exit 1
          fi

  # Records each master build in Sentry. The build has already created the
  # release, named by the commit hash as the SDK reports it, and uploaded its
  # source maps. This job links the release's commits through Sentry's GitHub
  # integration, so issues can name suspect commits, and records a production
  # deploy if the deploy job started the update, marking when production was
  # told to update. If that failed, no deploy is recorded: the daily timer
  # delivers the image later, at a time this run can't know.
  sentry-release:
    runs-on: "ubuntu-latest"
    name: Record the Sentry release
    if: ${{ !cancelled() && needs.merge-docker.result == 'success' && github.ref == 'refs/heads/master' }}
    needs:
      - merge-docker
      - deploy

    permissions:
      contents: read

    steps:
      # The whole history, so set_commits can find the commits since the
      # previous release
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the release
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: regulad
          SENTRY_PROJECT: doppelganger
        with:
          release: ${{ github.sha }}
          set_commits: auto
          # Links a default number of commits, rather than failing, when the
          # previous release has no commit in this history (none of the
          # releases before this job had commits linked)
          ignore_missing: true
          # Empty skips the deploy
          environment: ${{ needs.deploy.outputs.started == 'true' && 'production' || '' }}

  # Records each master build's Pheidippides versions in their own Sentry
  # projects. A version reaches devices in the web image: new devices install
  # it, and devices that take updates (devices.uses_stable_apks) install it the
  # next time they start. So each new version gets a release, with its commits,
  # and a production deploy if the deploy job started the update. A version
  # Sentry already has is one an earlier build shipped, since versionCode only
  # moves when the app changes, so it's skipped.
  sentry-release-pheidippides:
    runs-on: "ubuntu-latest"
    name: Record ${{ matrix.tag }} in Sentry
    if: ${{ !cancelled() && needs.merge-docker.result == 'success' && github.ref == 'refs/heads/master' }}
    needs:
      - merge-docker
      - deploy

    strategy:
      matrix:
        # package.json names, which are also the Sentry project slugs
        tag:
          - "pheidippides-notify"
          - "pheidippides-locate"
          - "pheidippides-administrate"

    permissions:
      contents: read

    steps:
      - name: Download the release name
        uses: actions/download-artifact@v8
        with:
          name: sentry-release-${{ matrix.tag }}
          path: ${{ runner.temp }}/sentry-release

      - name: Check whether Sentry has it
        id: release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          release="$(cat "$RUNNER_TEMP/sentry-release/sentry-release")"
          echo "name=$release" >> "$GITHUB_OUTPUT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/organizations/regulad/releases/$(jq -rn --arg v "$release" '$v | @uri')/")"
          case "$status" in
            404)
              echo "new=true" >> "$GITHUB_OUTPUT"
              echo "$release is new."
              ;;
            200)
              echo "new=false" >> "$GITHUB_OUTPUT"
              echo "$release is already in Sentry, so an earlier build shipped it."
              ;;
            *)
              echo "::error::Sentry answered $status when asked for $release."
              exit 1
              ;;
          esac

      # The whole history, so set_commits can find the commits since the
      # previous release
      - name: Checkout repository
        if: steps.release.outputs.new == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the release
        if: steps.release.outputs.new == 'true'
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3.7.2
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: regulad
          SENTRY_PROJECT: ${{ matrix.tag }}
        with:
          release: ${{ steps.release.outputs.name }}
          set_commits: auto
          # Links a default number of commits, rather than failing, when the
          # previous release has no commit in this history
          ignore_missing: true
          # Empty skips the deploy
          environment: ${{ needs.deploy.outputs.started == 'true' && 'production' || '' }}
